apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora-cx
  namespace: nexora-cx
  labels:
    app.kubernetes.io/name: nexora-cx
    app.kubernetes.io/part-of: bpo-website
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: nexora.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-cx
                port:
                  number: 80
  tls:
    - hosts:
        - nexora.example.com
      secretName: nexora-cx-tls
