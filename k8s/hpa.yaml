apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexora-cx
  namespace: nexora-cx
  labels:
    app.kubernetes.io/name: nexora-cx
    app.kubernetes.io/part-of: bpo-website
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexora-cx
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
