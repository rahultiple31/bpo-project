name: Build and Publish MicroShield BPO

on:
  push:
    branches:
      - main
    paths-ignore:
      - "charts/nexora-cx/values.yaml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nexora-cx
  IMAGE_TAG: ${{ github.sha }}
  HELM_VALUES_FILE: charts/nexora-cx/values.yaml

jobs:
  validate:
    name: Validate source and Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint Helm chart
        run: helm lint charts/nexora-cx

      - name: Render Helm manifests
        run: helm template nexora-cx charts/nexora-cx --namespace nexora-cx

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm-image:
    name: Update Helm image tag
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          values_file = Path("${{ env.HELM_VALUES_FILE }}")
          text = values_file.read_text()
          repository = "${{ env.IMAGE_NAME }}"
          tag = "${{ env.IMAGE_TAG }}"
          text = re.sub(r"(?m)^(\s*repository:\s*).*$", lambda match: f"{match.group(1)}{repository}", text, count=1)
          text = re.sub(r"(?m)^(\s*tag:\s*).*$", lambda match: f"{match.group(1)}{tag}", text, count=1)
          values_file.write_text(text)
          PY

      - name: Commit Helm values update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ env.HELM_VALUES_FILE }}"
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Helm image tag to ${IMAGE_TAG} [skip ci]"
          git push
